
name: HNS Catalogue Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install requests beautifulsoup4

      - name: HNS-Pack-Katalog erstellen
        run: |
          python build_hns_catalogue.py

      - name: Ergebnis anzeigen
        run: |
          echo "===== HNS PACK KATALOG ====="
          cat hns_catalog_report.txt
          echo "===== JSON DATEI ====="
          python - <<'PY'
          import json
          with open("hns_packs.json", encoding="utf-8") as f:
              data = json.load(f)
          packs = data.get("packs", [])
          print("Packs:", len(packs))
          for pack in packs:
              print(
                  pack["name"],
                  "| Strecken:",
                  pack["track_count_extracted"],
                  "| Status:",
                  pack["status"]
              )
          PY
