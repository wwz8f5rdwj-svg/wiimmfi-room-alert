
name: Region Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "3-59/6 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Scan Wiimmfi and send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m pip install requests

          python - <<'PY'
          import os
          import json
          import base64
          import requests

          # =====================================
          # WIIMMFI DATEN LADEN
          # =====================================

          url = "https://wiimmfi.de/stats/mkwx?m=json"
          response = requests.get(url, timeout=30)
          response.raise_for_status()
          data = response.json()

          # =====================================
          # STRECKEN-DIAGNOSE
          # =====================================

          TRACK_KEYWORDS = (
              "track",
              "course",
              "version",
              "cup",
              "arena",
              "slot"
          )

          def scan_track_fields(obj, path=""):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      current_path = f"{path}.{key}" if path else key

                      if any(word in key.lower()
                             for word in TRACK_KEYWORDS):
                          print(
                              "STRECKENFELD:",
                              current_path,
                              "=",
                              json.dumps(
                                  value,
                                  ensure_ascii=False,
                                  default=str
                              )
                          )

                      scan_track_fields(value, current_path)

              elif isinstance(obj, list):
                  for index, value in enumerate(obj):
                      scan_track_fields(
                          value,
                          f"{path}[{index}]"
                      )

          # =====================================
          # HNS-RÄUME ERKENNEN
          # =====================================

          current_rooms = {}
          hns_room_data = {}

          for item in data:
              if not isinstance(item, dict):
                  continue

              if item.get("type") != "room":
                  continue

              members = item.get("members", [])

              if any(
                  str(m.get("region")) == "20053"
                  for m in members
                  if isinstance(m, dict)
              ):
                  room_id = str(item.get("room_id", "unknown"))
                  room_name = item.get("room_name", "HNS-Raum")

                  current_rooms[room_id] = room_name
                  hns_room_data[room_id] = item

          print("=====================================")
          print("GEFUNDENE HNS-RÄUME:")
          print(json.dumps(current_rooms, indent=2, ensure_ascii=False))
          print("=====================================")

          # =====================================
          # DETAILLIERTE RAUM- UND STRECKENANALYSE
          # =====================================

          for room_id, item in hns_room_data.items():

              print("")
              print("=====================================")
              print("HNS STRECKEN-DIAGNOSE")
              print("=====================================")

              print("Room ID:", room_id)
              print("Raumname:", item.get("room_name"))

              for field in [
                  "game_id4",
                  "race_mode",
                  "race_phase",
                  "region",
                  "track",
                  "n_races",
                  "n_members",
                  "n_players"
              ]:
                  print("RAUM", field, ":", item.get(field))

              print("")
              print("--- STRECKENFELDER DES RAUMS ---")
              scan_track_fields(item)

              for index, member in enumerate(item.get("members", [])):
                  if not isinstance(member, dict):
                      continue

                  print("")
                  print("--- SPIELER", index + 1, "---")

                  for field in [
                      "region",
                      "track",
                      "flags_local",
                      "flags_connect",
                      "flags_nn_con",
                      "flags_nn_ack",
                      "flags_nn_suc",
                      "flags_client",
                      "ctgp_outdated",
                      "ctgp_flags",
                      "ctgp_proom",
                      "patcher_info"
                  ]:
                      print("SPIELER", field, ":", member.get(field))

                  print("--- STRECKENFELDER DES SPIELERS ---")
                  scan_track_fields(member)

          # =====================================
          # BISHERIGE RÄUME AUS GITHUB LADEN
          # =====================================

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          state_url = (
              f"https://api.github.com/repos/{repo}/contents/known_rooms.json"
          )

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json"
          }

          old_rooms = {}
          sha = None

          state_response = requests.get(
              state_url,
              headers=headers,
              timeout=30
          )

          if state_response.status_code == 200:
              state_file = state_response.json()
              sha = state_file["sha"]

              content = base64.b64decode(
                  state_file["content"]
              ).decode()

              old_rooms = json.loads(content)

          elif state_response.status_code != 404:
              state_response.raise_for_status()

          # =====================================
          # NUR NEUE RÄUME MELDEN
          # =====================================

          new_rooms = {
              room_id: name
              for room_id, name in current_rooms.items()
              if room_id not in old_rooms
          }

          if new_rooms:
              message = "🏁 NEUER HIDE & SEEK RAUM!\n\n"

              for room_id, name in new_rooms.items():
                  message += (
                      f"Raum: {name}\n"
                      f"Room ID: {room_id}\n\n"
                  )

              message += "Region 20053 wurde erkannt."

              telegram_url = (
                  "https://api.telegram.org/bot"
                  + os.environ["TELEGRAM_BOT_TOKEN"]
                  + "/sendMessage"
              )

              result = requests.post(
                  telegram_url,
                  data={
                      "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                      "text": message
                  },
                  timeout=30
              )

              result.raise_for_status()

              if not result.json().get("ok"):
                  raise Exception(
                      "Telegram-Nachricht konnte nicht gesendet werden"
                  )

              print("Telegram-Benachrichtigung gesendet!")

          else:
              print("Keine neuen HNS-Räume.")

          # =====================================
          # AKTUELLEN ZUSTAND IN GITHUB SPEICHERN
          # =====================================

          if current_rooms != old_rooms:

              content = base64.b64encode(
                  json.dumps(
                      current_rooms,
                      indent=2,
                      ensure_ascii=False
                  ).encode()
              ).decode()

              payload = {
                  "message": "Update detected HNS rooms",
                  "content": content
              }

              if sha:
                  payload["sha"] = sha

              save = requests.put(
                  state_url,
                  headers=headers,
                  json=payload,
                  timeout=30
              )

              save.raise_for_status()

              print("Raumstatus gespeichert.")

          print("")
          print("=====================================")
          print("SCAN ABGESCHLOSSEN")
          print("=====================================")
          PY
