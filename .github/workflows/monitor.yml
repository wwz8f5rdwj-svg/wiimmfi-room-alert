
name: Region Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/6 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Scan Wiimmfi and send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m pip install requests

          python - <<'PY'
          import os
          import json
          import base64
          import requests

          # Wiimmfi-Daten laden
          url = "https://wiimmfi.de/stats/mkwx?m=json"
          response = requests.get(url, timeout=30)
          response.raise_for_status()
          data = response.json()

          # HNS-Räume anhand der Spieler-Region 20053 erkennen
          current_rooms = {}

          for item in data:
              if not isinstance(item, dict):
                  continue

              if item.get("type") != "room":
                  continue

              members = item.get("members", [])

              if any(str(m.get("region")) == "20053"
                     for m in members if isinstance(m, dict)):
                  room_id = str(item.get("room_id", "unknown"))
                  current_rooms[room_id] = item.get("room_name", "HNS-Raum")

          print("Gefundene HNS-Räume:", current_rooms)

          # Bisher gemeldete Räume aus GitHub laden
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          state_url = f"https://api.github.com/repos/{repo}/contents/known_rooms.json"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json"
          }

          old_rooms = {}
          sha = None

          state_response = requests.get(state_url, headers=headers)

          if state_response.status_code == 200:
              state_file = state_response.json()
              sha = state_file["sha"]
              content = base64.b64decode(state_file["content"]).decode()
              old_rooms = json.loads(content)
          elif state_response.status_code != 404:
              state_response.raise_for_status()

          # Nur neue Räume melden
          new_rooms = {
              room_id: name
              for room_id, name in current_rooms.items()
              if room_id not in old_rooms
          }

          if new_rooms:
              message = "🏁 NEUER HIDE & SEEK RAUM!\n\n"

              for room_id, name in new_rooms.items():
                  message += f"Raum: {name}\nRoom ID: {room_id}\n\n"

              message += "Region 20053 wurde erkannt."

              telegram_url = (
                  "https://api.telegram.org/bot"
                  + os.environ["TELEGRAM_BOT_TOKEN"]
                  + "/sendMessage"
              )

              result = requests.post(
                  telegram_url,
                  data={
                      "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                      "text": message
                  },
                  timeout=30
              )
              result.raise_for_status()

              if not result.json().get("ok"):
                  raise Exception("Telegram-Nachricht konnte nicht gesendet werden")

              print("Telegram-Benachrichtigung gesendet!")
          else:
              print("Keine neuen HNS-Räume.")

          # Aktuellen Zustand in GitHub speichern
          if current_rooms != old_rooms:
              content = base64.b64encode(
                  json.dumps(current_rooms, indent=2).encode()
              ).decode()

              payload = {
                  "message": "Update detected HNS rooms",
                  "content": content
              }

              if sha:
                  payload["sha"] = sha

              save = requests.put(
                  state_url,
                  headers=headers,
                  json=payload,
                  timeout=30
              )
              save.raise_for_status()
              print("Raumstatus gespeichert.")
          PY
